<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1"
  >

  <title>Такси Анапа</title>

  <link rel="stylesheet" href="style.css">

  <script src="https://telegram.org/js/telegram-web-app.js"></script>
</head>

<body>
  <main class="app">
    <h1>Такси Анапа</h1>

    <section class="card">
      <label for="from">Откуда</label>

      <input
        id="from"
        type="text"
        placeholder="Адрес подачи"
      >

      <label for="to">Куда</label>

      <input
        id="to"
        type="text"
        placeholder="Адрес назначения"
      >

      <label for="route">Маршрут</label>

      <select id="route">
        <option value="">
          Выберите маршрут
        </option>
      </select>

      <label for="comment">Комментарий</label>

      <textarea
        id="comment"
        rows="3"
        placeholder="Комментарий водителю"
      ></textarea>

      <button
        id="calculateButton"
        type="button"
        class="button secondary"
      >
        Рассчитать стоимость
      </button>
    </section>

    <section
      id="priceCard"
      class="card hidden"
    >
      <p>Тариф: Стандарт</p>

      <div id="price" class="price">
        0 ₽
      </div>

      <button
        id="orderButton"
        type="button"
        class="button primary"
      >
        Заказать такси
      </button>
    </section>

    <section
      id="successCard"
      class="card hidden"
    >
      <h2>Заявка создана</h2>

      <p>
        На следующем этапе подключим отправку заявки в Telegram.
      </p>

      <button
        id="resetButton"
        type="button"
        class="button secondary"
      >
        Новая заявка
      </button>
    </section>
  </main>

  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
