<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8" />
  <title>Местное такси</title>
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <script src="https://telegram.org/js/telegram-web-app.js"></script>
  <style>
    body {
      font-family: system-ui, -apple-system, sans-serif;
      padding: 16px;
      background: var(--tg-theme-bg-color, #fff);
      color: var(--tg-theme-text-color, #000);
    }
    input, select {
      width: 100%;
      padding: 10px;
      margin: 8px 0;
      box-sizing: border-box;
      font-size: 16px;
    }
    button {
      width: 100%;
      padding: 12px;
      margin: 8px 0;
      font-size: 16px;
      cursor: pointer;
    }
    .order {
      border: 1px solid #ccc;
      border-radius: 8px;
      padding: 10px;
      margin-bottom: 10px;
    }
    .hidden {
      display: none;
    }
  </style>
</head>
<body>
  <h1>Такси MVP</h1>

  <!-- Выбор роли -->
  <div id="role-screen">
    <button id="btn-passenger">Я пассажир</button>
    <button id="btn-driver">Я водитель</button>
  </div>

  <!-- Экран пассажира -->
  <div id="passenger-screen" class="hidden">
    <h2>Создать заказ</h2>
    <input id="from" placeholder="Откуда" />
    <input id="to" placeholder="Куда" />
    <input id="comment" placeholder="Комментарий (необязательно)" />
    <button id="btn-create-order">Создать заказ</button>
    <div id="passenger-status"></div>
    <button id="btn-back-passenger">Назад</button>
  </div>

  <!-- Экран водителя -->
  <div id="driver-screen" class="hidden">
    <h2>Заказы</h2>
    <button id="btn-refresh-orders">Обновить список</button>
    <div id="orders-list"></div>
    <div id="driver-status"></div>
    <button id="btn-back-driver">Назад</button>
  </div>

  <script>
    // === ВСТАВЬТЕ СЮДА ВАШИ ДАННЫЕ ИЗ SUPABASE ===
    const SUPABASE_URL = 'https://urmxfmdnjstqfdcvaddt.supabase.co';
    const SUPABASE_ANON_KEY = 'eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6InVybXhmbWRuanN0cWZkY3ZhZGR0Iiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTA3MDkyMzgsImV4cCI6MjEwNjI4NTIzOH0.SgV_pDL7XFw83lJ18BzLocSPFVYPGcwBq3HLaxss7Yk';
    // =============================================

    const tg = window.Telegram.WebApp;
    tg.ready();
    tg.expand();

    // Простая "идентификация" пользователя — его Telegram ID
    const userId = tg.initDataUnsafe?.user?.id?.toString() || 'anon';

    // Переключение экранов
    const roleScreen = document.getElementById('role-screen');
    const passengerScreen = document.getElementById('passenger-screen');
    const driverScreen = document.getElementById('driver-screen');

    document.getElementById('btn-passenger').onclick = () => {
      roleScreen.classList.add('hidden');
      passengerScreen.classList.remove('hidden');
    };

    document.getElementById('btn-driver').onclick = () => {
      roleScreen.classList.add('hidden');
      driverScreen.classList.remove('hidden');
      loadOrders();
    };

    document.getElementById('btn-back-passenger').onclick = () => {
      passengerScreen.classList.add('hidden');
      roleScreen.classList.remove('hidden');
    };

    document.getElementById('btn-back-driver').onclick = () => {
      driverScreen.classList.add('hidden');
      roleScreen.classList.remove('hidden');
    };

    // Создание заказа
    document.getElementById('btn-create-order').onclick = async () => {
      const from = document.getElementById('from').value.trim();
      const to = document.getElementById('to').value.trim();
      const comment = document.getElementById('comment').value.trim();

      if (!from || !to) {
        alert('Заполните поля "Откуда" и "Куда"');
        return;
      }

      const statusEl = document.getElementById('passenger-status');
      statusEl.textContent = 'Создаю заказ...';

      try {
        const res = await fetch(SUPABASE_URL + '/rest/v1/orders', {
          method: 'POST',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            from,
            to,
            comment: comment || null,
            status: 'pending',
            user_id: userId,
            driver_id: null
          })
        });

        if (!res.ok) {
          throw new Error('Network response was not ok');
        }

        const data = await res.json();
        statusEl.textContent = 'Заказ создан! ID: ' + (data[0]?.id || '?');
        document.getElementById('from').value = '';
        document.getElementById('to').value = '';
        document.getElementById('comment').value = '';
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Ошибка создания заказа.';
      }
    };

    // Загрузка заказов для водителя
    document.getElementById('btn-refresh-orders').onclick = loadOrders;

    async function loadOrders() {
      const listEl = document.getElementById('orders-list');
      const statusEl = document.getElementById('driver-status');
      listEl.innerHTML = 'Загрузка...';

      try {
        const res = await fetch(
          SUPABASE_URL + '/rest/v1/orders?status=eq.pending&order=created_at.desc',
          {
            headers: {
              'apikey': SUPABASE_ANON_KEY,
              'Authorization': 'Bearer ' + SUPABASE_ANON_KEY
            }
          }
        );

        if (!res.ok) {
          throw new Error('Network response was not ok');
        }

        const orders = await res.json();
        listEl.innerHTML = '';

        if (orders.length === 0) {
          listEl.textContent = 'Нет доступных заказов.';
          return;
        }

        orders.forEach(o => {
          const div = document.createElement('div');
          div.className = 'order';
          div.innerHTML = `
            <div><b>ID:</b> ${o.id}</div>
            <div><b>Откуда:</b> ${o.from}</div>
            <div><b>Куда:</b> ${o.to}</div>
            <div><b>Комментарий:</b> ${o.comment || '-'}</div>
            <button data-order-id="${o.id}" data-user-id="${o.user_id || ''}">Принять</button>
          `;
          listEl.appendChild(div);
        });

        // Обработчики кнопок "Принять"
        listEl.querySelectorAll('button[data-order-id]').forEach(btn => {
          btn.onclick = () => acceptOrder(btn);
        });

      } catch (e) {
        console.error(e);
        listEl.textContent = 'Ошибка загрузки заказов.';
      }
    }

    // Принятие заказа
    async function acceptOrder(btn) {
      const orderId = btn.getAttribute('data-order-id');
      const userIdPassenger = btn.getAttribute('data-user-id');
      const statusEl = document.getElementById('driver-status');
      statusEl.textContent = 'Принимаю заказ...';

      try {
        const res = await fetch(SUPABASE_URL + `/rest/v1/orders?id=eq.${orderId}`, {
          method: 'PATCH',
          headers: {
            'Content-Type': 'application/json',
            'apikey': SUPABASE_ANON_KEY,
            'Authorization': 'Bearer ' + SUPABASE_ANON_KEY,
            'Prefer': 'return=representation'
          },
          body: JSON.stringify({
            status: 'accepted',
            driver_id: userId
          })
        });

        if (!res.ok) {
          throw new Error('Network response was not ok');
        }

        statusEl.textContent = 'Заказ принят!';
        loadOrders();

        // Опционально: можно отправить сообщение пассажиру через бота
        // (для этого нужен отдельный сервер, в MVP пока не делаем)
      } catch (e) {
        console.error(e);
        statusEl.textContent = 'Ошибка принятия заказа.';
      }
    }
  </script>
</body>
</html>
